name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: 00 4 * * *

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest # x86
        program:
          - kprobe
          - kretprobe
          - uprobe
          - uretprobe
          - xdp
          - classifier
          - lsm
          - tp_btf
          - tracepoint

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy,rust-src,rustfmt

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-generate

      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: bpf-linker

      - run: sudo apt update && sudo apt install expect golang
        if: runner.os == 'Linux'

      - run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - run: ./test.sh ${{ github.workspace }} ${{ matrix.program }}
        env:
          CRATE_NAME: ${{ matrix.crate_name }}

  check:
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
